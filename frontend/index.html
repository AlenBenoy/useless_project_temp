!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Supreme Court of Nonsense</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #14100c;
    color: #f3e9d2;
    overflow-x: hidden;
  }
 
  /* ---------- HOME PAGE ---------- */
  .home {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.18), transparent 55%),
      linear-gradient(180deg, #1b1510 0%, #14100c 100%);
    text-align: center;
  }
  .home .scales { font-size: 56px; margin-bottom: 8px; filter: drop-shadow(0 0 12px rgba(212,175,55,.5)); }
  .home h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: .04em;
    color: #e9d8a6;
    text-shadow: 0 2px 0 #6b4f1d, 0 6px 24px rgba(0,0,0,.6);
  }
  .home .subtitle {
    margin-top: 10px;
    font-style: italic;
    color: #b8a67a;
    font-size: clamp(.95rem, 2.2vw, 1.2rem);
  }
  .home form {
    margin-top: 42px;
    width: min(560px, 92vw);
    display: flex;
    gap: 10px;
  }
  .home input {
    flex: 1;
    padding: 14px 18px;
    font-size: 1rem;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid #8a6d2f;
    background: #241c12;
    color: #f3e9d2;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .home input:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,.25); }
  .home input::placeholder { color: #7d6c4a; font-style: italic; }
  .btn {
    padding: 14px 26px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: .05em;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: linear-gradient(180deg, #e3c565, #b8912e);
    color: #241a06;
    box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .15s, filter .15s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .home .hint { margin-top: 18px; font-size: .85rem; color: #6f5f40; max-width: 520px; }
  .home .error { margin-top: 14px; color: #e07a5f; font-size: .9rem; }

    font-size: clamp(.72rem, 1.15vw, .98rem);
    line-height: 1.45;
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
    opacity: 0;
    transform: translateY(14px) scale(.95);
    animation: pop .5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .bubble .speaker {
    display: block;
    font-size: .72em;
    font-weight: bold;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #8a6d2f;
    margin-bottom: 6px;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -22px;
    width: 0; height: 0;
    border: 12px solid transparent;
  }
  /* Judge — centered above the bench */
  .bubble-judge { left: 50%; top: 2%; --tx: -50%; }
  .bubble-judge::after {
    left: 50%; margin-left: -12px;
    border-top: 12px solid #20180e;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
  }
  /* Left lawyer */
  .bubble-left  { left: 3%;  top: 6%; }
  .bubble-left::after  { left: 20%; border-top: 12px solid #20180e; border-left: 12px solid transparent; border-right: 12px solid transparent; }
  /* Right lawyer */
  .bubble-right { right: 3%; top: 6%; }
  .bubble-right::after { right: 20%; border-top: 12px solid #20180e; border-left: 12px solid transparent; border-right: 12px solid transparent; }
 
  @keyframes pop { to { opacity: 1; transform: translateX(var(--tx, 0)) translateY(0) scale(1); } }
 
  .court-header {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(10,7,4,.85), transparent);
    z-index: 5;
  }
  .court-header .case-title {
    font-size: clamp(.85rem, 1.6vw, 1.15rem);
    font-style: italic;
    color: #e9d8a6;
    text-shadow: 0 2px 8px rgba(0,0,0,.9);
    max-width: 60vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-small { padding: 9px 16px; font-size: .85rem; }
  .loading-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 18px;
    align-items: center; justify-content: center;
    background: rgba(10,7,4,.75);
    backdrop-filter: blur(3px);
    font-style: italic; color: #e9d8a6;
  }
  .gavel { font-size: 44px; animation: bang 1s ease-in-out infinite; }
  @keyframes bang { 0%,100% { transform: rotate(-12deg);} 50% { transform: rotate(10deg) translateY(4px);} }
 
  @media (max-width: 760px) {
    .bubble { max-width: 44vw; min-width: 130px; padding: 10px 12px; }
    .bubble-judge { top: 12%; }
    .bubble-left, .bubble-right { top: 14%; }
    .home form { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
 
/* ============================================================
   CONFIG — point this at your n8n workflow's webhook node.
   The workflow should return JSON like:
     { "judge": "...", "lawyerLeft": "...", "lawyerRight": "..." }
   (or { "lines": ["...", "...", "..."] } — one line per speaker)
   If the webhook is unreachable (including the placeholder URL
   below), the app falls back to a mock debate so the demo still
   works. Swap in your real webhook URL, and make sure that
   webhook sends CORS headers (Access-Control-Allow-Origin) since
   this fetch call is made straight from the browser.
   ============================================================ */
const N8N_WEBHOOK_URL = "https://nikilauda.app.n8n.cloud/webhook-test/supreme-court-nonsense";
 
function mockDebate(topic) {
  const t = topic || "this absurd case";
  return {
    judge:      "Order! Order! We are here to settle the grave matter of " + t + ". Counsel, keep the nonsense to a minimum. Actually... carry on.",
    lawyerLeft: "Your Honor, the evidence is overwhelming. My client's position on " + t + " is clearly superior — I have a chart, a poem, and a very confident nod.",
    lawyerRight:"Objection! My esteemed colleague's chart is upside down. The defense argues that " + t + " is, legally speaking, a matter of pure vibes and precedent."
  };
}
 
function normalizeN8nResponse(data, topic) {
  if (!data) return mockDebate(topic);
  if (Array.isArray(data.lines) && data.lines.length >= 3) {
    return { judge: data.lines[0], lawyerLeft: data.lines[1], lawyerRight: data.lines[2] };
  }
  if (data.judge || data.lawyerLeft || data.lawyerRight) {
    const fallback = mockDebate(topic);
    return {
      judge:      data.judge      || fallback.judge,
      lawyerLeft: data.lawyerLeft || fallback.lawyerLeft,
      lawyerRight:data.lawyerRight|| fallback.lawyerRight
    };
  }
  return mockDebate(topic);
}
 
async function callN8nWorkflow(topic) {
  try {
    const res = await fetch(N8N_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: topic, session: "supreme-court-of-nonsense" })
    });
    if (!res.ok) throw new Error("webhook returned " + res.status);
    const data = await res.json();
    return { debate: normalizeN8nResponse(data, topic), usedFallback: false };
  } catch (err) {
    console.warn("n8n webhook unavailable, using mock debate:", err);
    return { debate: mockDebate(topic), usedFallback: true };
  }
}
 
/* ------------------------- ROUTER ------------------------- */
function useHashRoute() {
  const get = () => window.location.hash.replace(/^#/, "") || "/";
  const [route, setRoute] = useState(get);
  useEffect(() => {
    const onHash = () => setRoute(get());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
}
 
/* ------------------------- HOME ------------------------- */
function HomePage({ onCaseSubmitted }) {
  const [topic, setTopic] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
 
  async function handleSubmit(e) {
    e.preventDefault();
    const t = topic.trim();
    if (!t) { setError("The court requires a topic before it can entertain nonsense."); return; }
    setError("");
    setLoading(true);
    const { debate } = await callN8nWorkflow(t);
    onCaseSubmitted({ topic: t, debate: debate });
    setLoading(false);
    window.location.hash = "/courtroom";
  }
 
  return (
    <div className="home">
      <div className="scales">⚖️</div>
      <h1>Supreme Court of Nonsense</h1>
      <p className="subtitle">Where gravity is optional, objections are decorative, and every ruling is final-ish.</p>
      <form onSubmit={handleSubmit}>
        <input
          type="text"
          value={topic}
          onChange={e => setTopic(e.target.value)}
          placeholder="Enter the topic of today's courtroom session…"
          disabled={loading}
          maxLength={200}
        />
        <button className="btn" type="submit" disabled={loading}>
          {loading ? "Convening…" : "Submit to the Court"}
        </button>
      </form>
      {error && <p className="error">{error}</p>}
      {loading && <p className="hint">The honorable workflow is deliberating…</p>}
      <p className="hint">
        Submissions are sent to the n8n workflow for a ruling (falls back to a mock ruling if it's unreachable).
      </p>
    </div>
  );
}
 
/* ---------------------- COURTROOM ---------------------- */
function CourtroomPage({ caseData, onNewCase }) {
  useEffect(() => {
    if (!caseData) { window.location.hash = "/"; }
  }, [caseData]);
 
  if (!caseData) {
    return (
      <div className="loading-overlay">
        <div className="gavel">🔨</div>
        <p>Reconvening the court…</p>
      </div>
    );
  }
 
  const { topic, debate } = caseData;
 
  return (
    <div className="courtroom">
      <div className="court-bg"></div>
      <div className="court-vignette"></div>
 
      <div className="court-header">
        <span className="case-title">Case No. 42 — "{topic}"</span>
        <button className="btn btn-small" onClick={onNewCase}>
          ⚖️ New Case
        </button>
      </div>
 
      <div className="bubble bubble-judge" style={{animationDelay: "0.2s"}}>
        <span className="speaker">👨‍⚖️ Judge</span>
        {debate.judge}
      </div>
      <div className="bubble bubble-left" style={{animationDelay: "0.8s"}}>
        <span className="speaker">🧑‍💼 Prosecution</span>
        {debate.lawyerLeft}
      </div>
      <div className="bubble bubble-right" style={{animationDelay: "1.4s"}}>
        <span className="speaker">🧑‍💼 Defense</span>
        {debate.lawyerRight}
      </div>
    </div>
  );
}
 
/* ------------------------- APP ------------------------- */
function App() {
  const route = useHashRoute();
  // Case data lives in memory (React state) for the current session instead
  // of sessionStorage/localStorage, so it's set once on submit and passed
  // straight down to the courtroom page.
  const [caseData, setCaseData] = useState(null);
 
  function handleNewCase() {
    setCaseData(null);
    window.location.hash = "/";
  }
 
  return route === "/courtroom"
    ? <CourtroomPage caseData={caseData} onNewCase={handleNewCase} />
    : <HomePage onCaseSubmitted={setCaseData} />;
}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
